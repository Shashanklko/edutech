name: EduVera CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Frontend Client Build & Lint Job
  # ==========================================
  client-ci:
    name: Client Build & Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Frontend Application (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  # ==========================================
  # 2. Backend Server Tests & Health Job
  # ==========================================
  server-ci:
    name: Backend API & Service Validation
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: server

    env:
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/eduvera_ci_db

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        run: |
          node -c server.js
          node -c config/db.js
          node -c controllers/operatorController.js
          node -c controllers/authController.js
          node -c services/authService.js
          node -c services/operatorService.js
          node -c services/studentService.js

      - name: Seed CI Database with Statutory Records
        run: node seed_mongodb.js

      - name: Start Background Server & Run Mock Test Suite
        run: |
          node server.js &
          # Wait up to 15 seconds for server health endpoint to be ready
          for i in {1..15}; do
            if curl -s http://127.0.0.1:5000/health | grep -q "ok"; then
              echo "Server health check passed!"
              break
            fi
            echo "Waiting for backend server..."
            sleep 1
          done
          node test_mock_suite.js
